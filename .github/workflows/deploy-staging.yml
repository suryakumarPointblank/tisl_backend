name: Deploy to Staging

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/suryakumarpointblank/tisl_backend:staging
  CONTAINER: tisl_backend_staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}
            docker stop ${{ env.CONTAINER }} || true
            docker rm ${{ env.CONTAINER }} || true
            docker run -d --name ${{ env.CONTAINER }} \
              --network tisl_staging_default \
              -p 8093:5000 \
              --env-file /data/sites/staging_tisl_backend/.env \
              -v /data/sites/staging_tisl_backend/google-cloud-key.json:/usr/src/app/google-cloud-key.json:ro \
              --restart unless-stopped \
              ${{ env.IMAGE }}
            docker logout ghcr.io
            docker image prune -f
